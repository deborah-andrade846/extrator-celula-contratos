name: Executável Windows

# Gera o Extrator como programa de desktop para Windows, com o Tesseract embutido.
# O .zip fica disponível em Actions > (execução) > Artifacts, e vira Release ao criar uma tag v*.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["main"]
    paths:
      - "app_web.py"
      - "requirements.txt"
      - "desktop/**"
      - ".github/workflows/build-windows.yml"
  pull_request:
    paths:
      - "app_web.py"
      - "requirements.txt"
      - "desktop/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.11.1

      - name: Embutir o Tesseract e os idiomas
        shell: pwsh
        run: |
          choco install tesseract --no-progress -y
          $origem = "C:\Program Files\Tesseract-OCR"
          New-Item -ItemType Directory -Force -Path desktop\tesseract\tessdata | Out-Null
          Copy-Item "$origem\*" desktop\tesseract -Recurse -Force
          # português e detecção de orientação (o app usa os dois); "standard", não "fast",
          # para manter a precisão medida em Linux
          foreach ($idioma in @("por", "osd", "eng")) {
            $destino = "desktop\tesseract\tessdata\$idioma.traineddata"
            Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata/raw/main/$idioma.traineddata" -OutFile $destino
          }
          & desktop\tesseract\tesseract.exe --version
          $env:TESSDATA_PREFIX = "$PWD\desktop\tesseract\tessdata"
          & desktop\tesseract\tesseract.exe --list-langs

      - name: Gerar o executável
        run: pyinstaller --noconfirm --clean desktop/extrator.spec

      - name: Conferir se o programa sobe e responde
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\ExtratorApoena\ExtratorApoena.exe" -PassThru
          $ok = $false
          foreach ($i in 1..40) {
            Start-Sleep -Seconds 3
            try {
              $r = Invoke-WebRequest -Uri "http://localhost:8501/healthz" -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "O executável não respondeu em http://localhost:8501" }
          Write-Host "Executável subiu e respondeu."

      - name: Compactar
        shell: pwsh
        run: Compress-Archive -Path dist\ExtratorApoena\* -DestinationPath ExtratorApoena-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ExtratorApoena-windows
          path: ExtratorApoena-windows.zip
          retention-days: 30

      - name: Publicar na Release (somente em tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ExtratorApoena-windows.zip
